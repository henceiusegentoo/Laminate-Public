paperVersion=26.2
# Full Maven artifact version string for the paper-api / paperweight dev-bundle compile
# dependencies (laminate-api, laminate-core-mixins, test-plugin) - developers set this directly
# rather than the build deriving it from paperVersion, since Paper's dev-bundle coordinate scheme
# has changed shape before (classic "<mcVersion>-R0.1-SNAPSHOT" vs. the newer
# "<mcVersion>.build.<n>-<channel>" scheme introduced alongside Minecraft's 26.x versioning) and
# will likely change again. Update this whenever paperVersion changes - check
# https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/ for the exact
# published coordinate.
paperDevBundleVersion=26.2.build.112-stable
laminateVersion=0.1.0-SNAPSHOT

org.gradle.jvmargs=-Xmx8G
org.gradle.parallel=true
